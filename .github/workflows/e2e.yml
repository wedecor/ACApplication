name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ac_platform_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ac_platform_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ac_platform_e2e?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ac_platform_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e_jwt_secret_for_tests_only_32chars_min
      JWT_REFRESH_SECRET: e2e_jwt_refresh_secret_tests_only_32chars
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20.11.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @ac/database migrate:deploy
      - run: pnpm --filter @ac/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ac/web build
      - run: pnpm --filter @ac/web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
